name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build wheel (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Run unit tests
        run: python -m unittest tests.test_ai_client tests.test_models -v

      - name: Build package
        run: python -m build

      - name: Verify wheel contents and entry point
        run: |
          python -m unittest tests.test_wheel -v
          python -m zipfile -l dist/*.whl | grep -E \
            'behavior_pack/manifest.json|behavior_pack/scripts/main.js|endstone_bot/bot_plugin.py|endstone_bot/ai_client.py'

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-py${{ matrix.python-version }}
          path: dist/
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: dist-*
          merge-multiple: true

      - name: Show built artifacts
        run: ls -la artifacts/

      - name: Create Release and attach wheel
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.whl
          generate_release_notes: true
          fail_on_unmatched_files: true
